     <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Product Store</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f9f9f9; padding: 20px; }
        .card { max-width: 400px; background: white; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 6px; }
        .qr-box img { width: 200px; height: 200px; margin-top: 10px; }
        .price { font-size: 22px; color: #28a745; font-weight: bold; margin: 10px 0; }
        .btn { background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 10px; font-weight: bold; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="pName">Loading Product...</h2>
        <img id="pImage" src="" alt="Product Image">
        <div class="price" id="pPrice">₹0</div>
        
        <hr>
        <h3>Payment Scanner</h3>
        <div class="qr-box">
            <img id="pQr" src="" alt="QR Code">
        </div>
        <p>UPI ID: <b id="pUpi">Loading...</b></p>

        <a id="pPhone" href="#" class="btn">Contact Support</a>
    </div>

    <!-- Firebase Script to Load Data Live -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6eccqVCv0sugTxtrzQeI",
            authDomain: "admin-5e91e.firebaseapp.com",
            projectId: "admin-5e91e",
            storageBucket: "admin-5e91e.appspot.com",
            messagingSenderId: "8304839037",
            appId: "1:8304839037:web:95EF8df37ff9f9261efc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadStoreData() {
            try {
                const docRef = doc(db, "settings", "adminData");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById("pName").innerText = data.productName || "Product Name";
                    document.getElementById("pPrice").innerText = "₹" + (data.productPrice || "0");
                    document.getElementById("pImage").src = data.productImage || "";
                    document.getElementById("pQr").src = data.qrlink || "";
                    document.getElementById("pUpi").innerText = data.upId || "UPI ID missing";
                    document.getElementById("pPhone").href = "tel:" + (data.supportPhone || "");
                    document.getElementById("pPhone").innerText = "Call Support: " + (data.supportPhone || "");
                } else {
                    console.log("No data found in Firebase!");
                }
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        loadStoreData();
    </script>

</body>
</html>
