<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // Apni Firebase configuration yahan dalen
        const firebaseConfig = {
          apiKey: "APNI_API_KEY_YAHAN_DALEN",
          authDomain: "APKA_PROJECT.firebaseapp.com",
          projectId: "APKA_PROJECT_ID",
          storageBucket: "APKA_PROJECT.appspot.com",
          messagingSenderId: "SENDER_ID",
          appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveData = async function() {
            const upiId = document.getElementById('upiId').value;
            const supportPhone = document.getElementById('supportPhone').value;
            const qrLink = document.getElementById('qrLink').value;

            try {
                await setDoc(doc(db, "settings", "adminData"), {
                    upiId: upiId,
                    supportPhone: supportPhone,
                    qrLink: qrLink
                }, { merge: true });
                alert("Data Successfully Save Ho Gaya!");
            } catch (e) {
                alert("Error: " + e.message);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Admin Settings</h2>
        <label>UPI ID:</label>
        <input type="text" id="upiId" placeholder="Enter UPI ID">
        
        <label>Support Phone:</label>
        <input type="text" id="supportPhone" placeholder="Enter Phone Number">
        
        <label>QR Link:</label>
        <input type="text" id="qrLink" placeholder="Enter QR Image Link">
        
        <button onclick="saveData()">Save Changes</button>
    </div>
</body>
</html>
