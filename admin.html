<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Gift Product</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .container { max-width: 450px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        input { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        label { font-weight: bold; color: #333; }
        button { background: #28a745; color: white; padding: 12px; border: none; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #ddd; }
        h2, h3 { text-align: center; color: #333; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6eccqVCv0sugTxtrzQeI",
            authDomain: "admin-5e91e.firebaseapp.com",
            projectId: "admin-5e91e",
            storageBucket: "admin-5e91e.appspot.com",
            messagingSenderId: "8304839037",
            appId: "1:8304839037:web:95EF8df37ff9f9261efc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveData = async function() {
            const upId = document.getElementById("upId").value;
            const supportPhone = document.getElementById("supportPhone").value;
            const qrlink = document.getElementById("qrlink").value;
            const productName = document.getElementById("productName").value;
            const productPrice = document.getElementById("productPrice").value;
            const productImage = document.getElementById("productImage").value;

            try {
                await setDoc(doc(db, "settings", "adminData"), {
                    upId: upId,
                    supportPhone: supportPhone,
                    qrlink: qrlink,
                    productName: productName,
                    productPrice: productPrice,
                    productImage: productImage
                }, { merge: true });
                alert("Settings aur Product Successfully Update Ho Gaye!");
            } catch (e) {
                alert("Error: " + e.message);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Admin Dashboard</h2>
        
        <label>UPI ID:</label>
        <input type="text" id="upId" placeholder="Enter UPI ID (e.g. mobile@paytm)">

        <label>Support Phone Number:</label>
        <input type="text" id="supportPhone" placeholder="Enter Phone Number">

        <label>QR Code Image Link:</label>
        <input type="text" id="qrlink" placeholder="Paste QR Image URL">

        <hr>
        <h3>Product Details</h3>

        <label>Product Name:</label>
        <input type="text" id="productName" placeholder="Enter Product Name">

        <label>Product Price (₹):</label>
        <input type="text" id="productPrice" placeholder="Enter Price">

        <label>Product Image Link:</label>
        <input type="text" id="productImage" placeholder="Paste Product Image URL">

        <button onclick="saveData()">Save All Changes</button>
    </div>
</body>
</html>
