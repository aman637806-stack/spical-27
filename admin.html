<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swaba Handicraft - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f5f7; }
    </style>
</head>
<body class="text-neutral-800">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full border border-neutral-200">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-amber-100 text-amber-800 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-xl">S</div>
                <h2 class="text-xl font-bold text-neutral-900">Admin Portal</h2>
                <p class="text-xs text-neutral-500 mt-1">Swaba Handicraft Management</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-700 mb-1">Admin Password</label>
                    <input type="password" id="admin-pass" placeholder="Enter Password (admin123)" class="w-full text-sm p-3 rounded-xl border border-neutral-300 focus:outline-none focus:border-amber-600">
                </div>
                <button onclick="loginAdmin()" class="w-full bg-neutral-900 text-white font-bold py-3 rounded-xl text-sm hover:bg-neutral-800 transition">
                    Login to Dashboard
                </button>
            </div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="admin-dashboard" class="hidden min-h-screen flex flex-col">
        <header class="bg-white border-b border-neutral-200 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-amber-600 text-white rounded-full flex items-center justify-center font-bold">S</div>
                <h1 class="font-bold text-base md:text-lg text-neutral-900">Swaba Admin Panel</h1>
            </div>
            <button onclick="location.reload()" class="text-xs font-semibold text-red-600 bg-red-50 border border-red-200 px-4 py-2 rounded-xl hover:bg-red-100 transition">
                <i class="fa-solid fa-power-off mr-1"></i> Logout
            </button>
        </header>

        <main class="max-w-7xl mx-auto p-4 md:p-8 w-full flex-grow space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200">
                    <h3 class="font-bold text-sm text-neutral-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-qrcode text-amber-600"></i> Update UPI QR Code & ID
                    </h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-neutral-700 mb-1">UPI ID</label>
                            <input type="text" id="setting-upi" placeholder="e.g. merchant@paytm" class="w-full text-xs p-2.5 rounded-lg border border-neutral-300">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-neutral-700 mb-1">QR Code Image Link / Filename</label>
                            <input type="text" id="setting-qr" placeholder="e.g. qr.jpg or URL" class="w-full text-xs p-2.5 rounded-lg border border-neutral-300">
                        </div>
                        <button onclick="saveSettings()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                            Save QR Settings
                        </button>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200">
                    <h3 class="font-bold text-sm text-neutral-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-headset text-amber-600"></i> Customer Care Number
                    </h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-neutral-700 mb-1">Support Phone Number</label>
                            <input type="text" id="setting-phone" placeholder="e.g. +91 9876543210" class="w-full text-xs p-2.5 rounded-lg border border-neutral-300">
                        </div>
                        <div class="pt-6">
                            <button onclick="saveSupportPhone()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                                Save Phone Number
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200">
                <h3 class="font-bold text-sm text-neutral-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-amber-600"></i> Add New Product
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="new-prod-name" placeholder="Product Name" class="text-xs p-2.5 rounded-lg border border-neutral-300">
                    <input type="number" id="new-prod-price" placeholder="Offer Price (₹)" class="text-xs p-2.5 rounded-lg border border-neutral-300">
                    <input type="number" id="new-prod-oldprice" placeholder="MRP Price (₹)" class="text-xs p-2.5 rounded-lg border border-neutral-300">
                    <input type="text" id="new-prod-img" placeholder="Image Filename (e.g. item.jpg)" class="text-xs p-2.5 rounded-lg border border-neutral-300">
                </div>
                <div class="mt-3">
                    <textarea id="new-prod-desc" placeholder="Product Description..." class="w-full text-xs p-2.5 rounded-lg border border-neutral-300 h-16"></textarea>
                </div>
                <button onclick="addNewProduct()" class="mt-3 bg-neutral-900 hover:bg-neutral-800 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition">
                    Publish Product
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-neutral-200 overflow-hidden">
                <div class="p-6 border-b border-neutral-200 flex items-center justify-between">
                    <h3 class="font-bold text-sm text-neutral-900 flex items-center gap-2">
                        <i class="fa-solid fa-shopping-bag text-amber-600"></i> Customer Orders Received
                    </h3>
                    <span id="order-count" class="text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-bold">0 Orders</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-neutral-50 border-b border-neutral-200 text-neutral-600">
                                <th class="p-4">Date / Time</th>
                                <th class="p-4">Customer Details</th>
                                <th class="p-4">Shipping Address</th>
                                <th class="p-4">Product & Amount</th>
                                <th class="p-4">Action</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body">
                            <tr><td colspan="5" class="p-6 text-center text-neutral-400">Loading orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD6cmccqYCPvOsuqTxtzdQEIksL3xxheJM",
            authDomain: "admin-8a91e.firebaseapp.com",
            projectId: "admin-8a91e",
            storageBucket: "admin-8a91e.appspot.com",
            messagingSenderId: "83948390837",
            appId: "1:83948390837:web:895fd8fed37fff99281efc",
            measurementId: "O-HFMNBZJLEY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function loginAdmin() {
            const pass = document.getElementById('admin-pass').value.trim();
            if (pass === "admin123") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadOrders();
                loadSettings();
            } else {
                alert('Wrong Password! Default password is admin123');
            }
        }

        function loadOrders() {
            db.collection("orders").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const tbody = document.getElementById('orders-table-body');
                document.getElementById('order-count').innerText = `${snapshot.size} Orders`;
                
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-neutral-400">No orders yet.</td></tr>`;
                    return;
                }

                let html = '';
                snapshot.forEach((doc) => {
                    const order = doc.data();
                    const dateStr = order.createdAt ? new Date(order.createdAt.seconds * 1000).toLocaleString() : 'Just now';
                    html += `
                        <tr class="border-b border-neutral-100 hover:bg-neutral-50">
                            <td class="p-4 text-neutral-500 font-mono">${dateStr}</td>
                            <td class="p-4">
                                <p class="font-bold text-neutral-900">${order.name}</p>
                                <p class="text-neutral-500"><i class="fa-solid fa-phone text-[10px]"></i> ${order.phone}</p>
                            </td>
                            <td class="p-4 text-neutral-600 max-w-xs">${order.house}, ${order.address}, ${order.city} - ${order.pincode}</td>
                            <td class="p-4">
                                <p class="font-bold text-neutral-900">${order.product}</p>
                                <p class="text-amber-700 font-bold">₹${order.price}</p>
                            </td>
                            <td class="p-4">
                                <button onclick="deleteOrder('${doc.id}')" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i> Delete</button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            });
        }

        function deleteOrder(id) {
            if (confirm('Delete this order?')) {
                db.collection("orders").doc(id).delete();
            }
        }

        function saveSettings() {
            const upi = document.getElementById('setting-upi').value.trim();
            const qr = document.getElementById('setting-qr').value.trim();
            db.collection("settings").doc("store_config").set({ upiId: upi, qrCode: qr }, { merge: true })
            .then(() => alert('QR & UPI updated!'));
        }

        function saveSupportPhone() {
            const phone = document.getElementById('setting-phone').value.trim();
            db.collection("settings").doc("store_config").set({ supportPhone: phone }, { merge: true })
            .then(() => alert('Phone updated!'));
        }

        function loadSettings() {
            db.collection("settings").doc("store_config").get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if(data.upiId) document.getElementById('setting-upi').value = data.upiId;
                    if(data.qrCode) document.getElementById('setting-qr').value = data.qrCode;
                    if(data.supportPhone) document.getElementById('setting-phone').value = data.supportPhone;
                }
            });
        }

        function addNewProduct() {
            const name = document.getElementById('new-prod-name').value.trim();
            const price = parseFloat(document.getElementById('new-prod-price').value);
            const oldPrice = parseFloat(document.getElementById('new-prod-oldprice').value);
            const img = document.getElementById('new-prod-img').value.trim();
            const desc = document.getElementById('new-prod-desc').value.trim();

            if (!name || !price || !img) {
                alert('Please fill Name, Price and Image filename!');
                return;
            }

            db.collection("products").add({
                name: name, price: price, oldPrice: oldPrice || price*2,
                image: img, description: desc || "Best quality product",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert('Product added successfully!');
                document.getElementById('new-prod-name').value = '';
                document.getElementById('new-prod-price').value = '';
                document.getElementById('new-prod-oldprice').value = '';
                document.getElementById('new-prod-img').value = '';
                document.getElementById('new-prod-desc').value = '';
            });
        }
    </script>
</body>
</html>
